[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patchroute"
version = "0.1.0"
description = "Dependency vulnerability triage with EPSS and CISA KEV enrichment"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[project.scripts]
patchroute = "patchroute:main"

[tool.setuptools]
py-modules = ["patchroute"]

