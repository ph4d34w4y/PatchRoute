name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile patchroute.py
      - name: Built-in checks
        run: python patchroute.py --selftest
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Offline demo
        run: python patchroute.py --demo -o /tmp/patchroute-demo.html --json /tmp/patchroute-demo.json

